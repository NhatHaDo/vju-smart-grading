name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip, cache-dependency-path: backend/requirements.txt }
      - run: pip install -r backend/requirements.txt pytest
      - run: cd backend && pytest -q
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Build giao diện (gọi API cùng domain)
        run: cd frontend && npm ci && VITE_API_BASE= npm run build
      - uses: actions/upload-artifact@v4
        with: { name: frontend-dist, path: frontend/dist }

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    # Server nội bộ GitHub không với tới được → self-hosted runner cài trên chính server (user scoring)
    runs-on: [self-hosted, vju-prod]
    concurrency: { group: deploy, cancel-in-progress: false }
    steps:
      - uses: actions/download-artifact@v4
        with: { name: frontend-dist, path: dist-new }
      - name: Cập nhật giao diện
        run: |
          mkdir -p "$HOME/vju-smart-grading/frontend/dist"
          rsync -a --delete dist-new/ "$HOME/vju-smart-grading/frontend/dist/"
      - name: Cập nhật backend + khởi động lại (supervisor)
        run: SKIP_FRONTEND_BUILD=1 bash "$HOME/vju-smart-grading/deploy.sh"
