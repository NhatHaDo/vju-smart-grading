name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt }
      - run: pip install -r backend/requirements.txt pytest
        # LibreOffice không cài ở CI: test phần công thức Word tự bỏ qua nếu thiếu soffice
      - run: cd backend && pytest -q
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: cd frontend && npm ci && npm run build

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    # Server nội bộ GitHub không với tới được → dùng self-hosted runner cài trên chính server
    runs-on: [self-hosted, vju-prod]
    concurrency: { group: deploy, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v4
      - name: Build & restart
        run: docker compose --env-file /opt/vju/deploy.env --profile tunnel up -d --build --remove-orphans
      - name: Health check
        run: |
          for i in $(seq 1 30); do
            curl -fs "http://localhost:${WEB_PORT:-8080}/api/v1/health" && exit 0
            sleep 3
          done
          docker compose logs --tail=50 backend
          exit 1
      - run: docker image prune -f
