server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 100m;   # upload ảnh/PDF/Word hàng loạt

    # API + ảnh debug/ảnh gốc → backend
    location ~ ^/(api|outputs|uploads)/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Cloudflare/proxy phía ngoài đã gắn X-Forwarded-Proto, giữ nguyên
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 300s;  # chấm hàng loạt có thể lâu
    }

    # index.html luôn lấy mới (tránh điện thoại giữ bản cũ sau deploy)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # file build có hash trong tên → cache lâu được
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA routing cho React Router
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
