# Chạy:  docker compose --env-file deploy.env up -d --build
# Mở ra ngoài bằng Cloudflare Tunnel:  thêm  --profile tunnel
services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: sqlite:////data/vju_smart_grading.db
      OMR_UPLOAD_DIR: /data/uploads
      OMR_OUTPUT_DIR: /data/outputs
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Đặt JWT_SECRET_KEY trong deploy.env}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://scoring.example.edu.vn}
    volumes:
      - app_data:/data          # DB + ảnh upload + ảnh debug (cần backup thư mục này)
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on: [backend]
    ports:
      - "${WEB_PORT:-8080}:80"   # reverse proxy của IT trỏ vào cổng này

  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: [tunnel]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on: [web]

volumes:
  app_data:
