; Supervisor chạy bằng user thường (không cần root). Cài bởi deploy/setup_user_supervisor.sh
[unix_http_server]
file=%(ENV_HOME)s/supervisor/supervisor.sock

[supervisord]
logfile=%(ENV_HOME)s/logs/supervisord.log
pidfile=%(ENV_HOME)s/supervisor/supervisord.pid
childlogdir=%(ENV_HOME)s/logs

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix://%(ENV_HOME)s/supervisor/supervisor.sock

[program:vju-backend]
directory=%(ENV_HOME)s/vju-smart-grading/backend
command=%(ENV_HOME)s/vju-smart-grading/backend/.venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 10000 --proxy-headers --forwarded-allow-ips=*
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
stdout_logfile=%(ENV_HOME)s/logs/vju-backend.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
redirect_stderr=true
