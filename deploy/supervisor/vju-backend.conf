; Đặt vào thư mục conf của supervisor (vd /etc/supervisor/conf.d/) rồi:
;   supervisorctl reread && supervisorctl update
; Sửa /home/scoring/... nếu đường dẫn khác.
[program:vju-backend]
directory=/home/scoring/vju-smart-grading/backend
command=/home/scoring/vju-smart-grading/backend/.venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 10000 --proxy-headers --forwarded-allow-ips=*
user=scoring
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
stdout_logfile=/home/scoring/logs/vju-backend.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
redirect_stderr=true
